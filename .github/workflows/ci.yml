name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Named on purpose: this is the same install the release job runs first, so a lockfile that
      # drifted from a package.json fails HERE with an obvious label rather than deep inside a
      # release. It cannot be the only guard, though — the changesets "version packages" PR is
      # opened with GITHUB_TOKEN, and GitHub does not run `pull_request` workflows for those, so a
      # drift introduced by versioning is only seen by this workflow's `push: master` run, after the
      # merge. The prevention lives in the root `version-packages` script, which regenerates the
      # lockfile as part of versioning so that PR is self-consistent by construction.
      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  # The unit suite exercises the billing layer through the in-memory store, which is a
  # hand-written reimplementation of the store contract — so it can only ever prove the CALLERS
  # right. Two bugs lived under it for the package's whole life: the models never generated their
  # uuid `id` (so every insert failed on Postgres), and Lucid puts aggregates in `$extras` rather
  # than on the model instance (so `revenue()` always returned a silent zero). This job is what
  # keeps that class of bug from coming back.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Starts its own throwaway Postgres through testcontainers (the runner ships Docker), and
      # creates the tables by running the published migration stub rather than a copy of it.
      - run: pnpm --filter @adonis-agora/payments test:integration
